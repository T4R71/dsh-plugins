# 任务生长树组合包层：把四行插进任何选中它的 profile。
#
# 组合包只贡献行，不贡献整个组合：启用时插入下面四行，停用时就地移除，
# profile 的其余部分不受影响。四行由同一个组合包声明，所以插件页只出现一个条目。

- insert:
    # 真实宿主：plan_write / plan_step / plan_dispatch / plan_ask 四个工具。
    #
    # ⚠️ 这一行是**必须**的，缺它就整条链是断的：这四个工具都读写本包自有的设置
    # 命名空间里那棵树，而那一行是下面的 `plan-tree-sessions`。
    #
    # 收口后这一行只提供那棵树与 `taskTree` 服务：把 `exposeTools` 设成 `false`
    # 会摘掉四个工具与它们的用法策略段，但**不会**摘掉 `taskTree` 服务
    # （`packages/plan-tree/src/index.ts` 的 `apply` 里 `ctx.provide('taskTree', ...)`
    # 在开关之外），因为下面的 `task` 那一行正是靠这个服务读同一棵树。
    # 2026-09-29 用户裁决：**本组合包默认收口**，所以下面这一行就带着 `exposeTools: false`。
    # 依据：② 的目标是「把编排类工具**收成一个**一等 `task` 工具」；
    # 而本组合包整包**未发布**、本机也没有任何 profile 挂它——
    # 所以「默认 `false` 会静默剥夺已发货部署的能力」这个反对理由**前提不成立**。
    # 另外这个键写的是**本组合包自己那一行**，碰不到 `dsh-base` 的五件。
    # 想要那四个工具的人，在自己 profile 层写 `- id: plan-tree` + `config.exposeTools: true` 即可拿回。
    - id: plan-tree
      name: '@t4r71/dsh-plan-tree'
      config:
        exposeTools: false

    # 树的权威存储：一条**独立**的 Loader entry，id 就是设置命名空间
    # （`plan-tree-sessions`），字段只有 `trees`：会话 id → 树。
    #
    # 为什么不并进上面那一行：行的 ns 绑着设置页的行表单，多一个未声明字段会被投影进
    # 那张表单；这一行的 Config 只声明 `trees`，设置页不渲染它。
    #
    # 2026-09-29 起，这条链**一个会话事件都不写**。此前树随会话日志下发
    # （`plan/declared` / `plan/step`），那两个事件类型不在 0.1.7 的
    # KNOWN_SESSION_EVENT_TYPES 里，持久化读路径会因此**拒绝解释整个 log**
    # （dsh-session-persistence/lib/index.js:184）——一旦写过，那条会话就再也打不开。
    - id: plan-tree-sessions
      name: '@t4r71/dsh-plan-tree/session-store'

    # 收口的那一件：一个一等 `task` 工具，取代编排五件 + 任务树四件。
    #
    # ⚠️ 这一行 2026-09-29 才挂上（此前本组合包**没有**它，所以
    # `@t4r71/dsh-task` 从来没被任何组合包挂载过）。它必须排在 `plan-tree` **之后**：
    # `task` 不自带存储，它经 `ctx.get('taskTree')` 取得上面两行建立的那一份，
    # 行序倒了就没有服务可拿。
    #
    # `provider` 的取值来自真机：base profile 的 `subagent-spawn-in-process` 那一行
    # 注册的 provider 名就是 `spawn`（`@deepseek-ai/dsh-base/cordis.patch.yml` 里
    # `providerName: spawn`，全量 dump 见 M:\T4\out\stage2\collapse\runs\dump-A.txt）。
    # 名字写错**不会在装载时报错**——只有真的派发时才在 `startContinuable` 里失败
    # （`packages/task/src/index.ts:256`），所以这里按实测值写，不按猜测写。
    #
    # `presets` 只给 `deny`，不给 `allow`：`allow` 是白名单，写错一个名字就等于
    # 悄悄收走子代理的工具。
    #
    # ⚠️ 2026-10-14 实测证伪了「deny 写错一个名字只是白写一条」这条判断：
    # `tools.restrict()`（@deepseek-ai/dsh-tools）对**未知名字直接抛错**，整个派发失败：
    #   tools.restrict() names unknown global tools "todo_write", "subagent",
    #   "subagent_fork", "workflow"; known global tools: ...
    # 判据在 dsh-tools/lib/index.js：
    #   const known = this.view(scope).restrictableNames;
    #   const unknown = [...allow, ...deny].filter((n) => !known.has(n));
    #   if (unknown.length > 0) throw new Error('tools.restrict() names unknown global tool...')
    # 而 `restrictableNames` 只收**全局工具表里注册过的名字**（本机实测见下），
    # 所以 deny 必须逐字取自真实工具面，一个都不能凭印象写。
    #
    # 本机（desktop profile + ptc-custom）实测可用的全局工具名（35 个，去 run_code）：
    #   ask_user_question, create_goal, edit, exit_plan_mode, get_goal, glob, grep,
    #   interrupt_agent, job_kill, job_list, job_output, list_agents,
    #   load_workspace_dependencies, present, pwsh, qa_thread, read, read_image,
    #   schedule_create, schedule_delete, schedule_list, schedule_update,
    #   send_message, skill, spawn_teammate, task, team_task_create, team_task_get,
    #   team_task_list, team_task_update, update_goal, wait_agent, web_fetch,
    #   web_search, write
    # 下面**不存在的**四个名字曾导致派发 100% 失败，已移除：
    #   todo_write（本组合里被 disabled: true 关掉）、subagent、
    #   subagent_fork、workflow（都不在本 preset 的工具面里）。
    #
    # 下面出现的每一个名字都取自**真机实测的工具面**，不是从文档抄的：
    #   M:\T4\out\stage2\collapse\out-C-collapsed\tools-surface.json 的 `toolNames`
    #   = create_goal, edit, exit_plan_mode, get_goal, glob, grep, job_kill, job_list,
    #     job_output, pwsh, read, read_image, skill, task, todo_write, update_goal,
    #     web_fetch, web_search, workflow, write
    # 也就是说：这些名字在**收口后**的组合里确实存在。不在这份清单里的名字
    # 一律不写——包括 `plan_write` 这一类收口后已经不在面上的名字。
    - id: task
      name: '@t4r71/dsh-task'
      config:
        provider: spawn
        presets:
          # ── 身份两通道：preset（面）+ persona（兜底） ────────────────────────
          #
          # 为什么两条通道各给一个：
          #   preset  —— 唯一能让孩子【拥有父从来没有过的工具和技能组】的通道。
          #              指向 .agent-presets\role-*\agent.cordis.yml，身份提示词、
          #              技能组、工具面都写在那三个目录里。
          #   persona —— 兜底。名册在册时 task【只交 preset、不交 persona】（两条身份段
          #              同名同层会让宿主当场抛）；名册缺席/名字不在册/条目 broken 时
          #              自动退回 persona + toolFilter，此时这条兜底生效。
          #              实测证据：M:\DSH-RESCUE\tools\verify_channel.mjs 六条路径全跑过。
          #
          # ⛔ 不要再给 `deny`。2026-10-14 两次派发实测把它证伪了。
          # 第一次报：tools.restrict() names unknown global tools "todo_write",
          #   "subagent", "subagent_fork", "workflow"
          # 换成取自主会话面的名字后，第二次仍失败："spawn_teammate", "send_message",
          #   "interrupt_agent", "team_task_create", "team_task_update" 同样被判未知。
          #
          # 原因：tools.restrict() 的 restrictableNames 是**按目标 agent 的 scope 现算的**
          # （dsh-tools/lib/index.js 的 view(scope)），而 role-* 预设自带的工具面只有 5 行
          # （persona / skill-filesystem / tool-skill / tool-fs / tool-fs-search），
          # 产出 read / glob / grep / skill —— 主会话面上的名字在其中一个都不存在。
          # 且**一个未知名字就整体抛错**，整个派发失败，不是「白写一条」。
          #
          # 也别写成空数组 `deny: []`：两栏都给空会抛 EmptyPresetFilterError
          # （presets.js 的 resolvePreset）。**两栏都省略**才是「继承父」。
          #
          # preset 通道下本就不需要 deny：role-* 自带的面已是最小面。deny 只在降级路径
          # （名册缺席、退回 persona + toolFilter 平铺）才起作用，而那条路要求名字取自
          # **父的面** —— 与 preset 通道互相冲突，一份配置无法同时满足两个面。
          #
          # 角色行为要改，改 C:\Users\TRI\.dsh\.agent-presets\role-*\ 里的
          # persona\prefix.md 与 agent.cordis.yml，不用碰本文件。
          #
          # 排障信号：派发后若返回值里出现
          #   preset "role-recon" is not in the agent-preset roster (available: ...)
          # 就说明角色没被认到，已静默降级（不抛错）。
          # 2026-10-14 起 `preset` 是真的生效的 —— 但**不是**通过 SubagentStartRequest
          # 送进去的（那九字段里没有 preset，送了也没人读）。流程是：
          #   ① task 派发前把 childId → 'role-recon' 登记进 pendingPreset
          #   ② 孩子在 agent/created 那一刻（实测 lastTurn === 0、openTurnStartSeq === null）
          #      被 `agentPresets.select(agent, 'role-recon')` 换成**角色自己的整支 plugin 行**
          # 所以孩子拿到的面来自 role-recon\ 目录，**不是**从父的面里减出来的。
          #
          # 下面的 persona 是**兜底**，只在换面失败时才会被用上（那时 task 退回平铺通道，
          # 孩子在父的面里做减法）。角色正常生效时它**不会被读**，真源是
          # role-recon\persona\prefix.md。
          # `deny` 与角色目录的分工：角色目录管「提示词 / 工具面 / 技能」三件，
          # 而 `deny` 是**任务派发策略**（与 maxDepth 同类），所以留在本表。
          #
          # 为什么 recon 要 deny ops_bash：dsh-ops 是按 **agent** 挂工具的
          # （`dsh-ops` 的 `ctx.on('agent/created', attach)`），它绕过了
          # 「recon 目录里没有 shell 组」这个设计 —— 实测 recon 子代理拿到了 ops_bash。
          # 而 `tools.restrict` 只过滤**全局**工具（原注释："Restrict global tools ...
          # scoped registrations remain visible"），对 scope-local 的 ops_bash 无效。
          # 所以 task 改成在**执行时**拒绝：工具名还在孩子面上，但调用被单调挡下，
          # 并给出可读理由（"角色声明不使用 ops_bash ..."）。
          #
          # 同一格声明两条通道共用：降级通道（A 路）里它进 toolFilter 做减法；
          # 预设通道（B 路）里 toolFilter 不交，由 task 的执行前守卫兑现。
          recon:
            preset: role-recon
            persona: 'You are a reconnaissance agent. Read, search and report. Change nothing.'
            deny: [ops_bash]
            maxDepth: 1
          impl:
            preset: role-impl
            persona: 'You are an implementation agent. Make the change and prove it with a command.'
            maxDepth: 2
          verify:
            preset: role-verify
            persona: 'You are a verification agent. Reproduce the claim yourself and report evidence, not agreement.'
            maxDepth: 1
    # 浏览器半边：右侧边栏的大纲面板。数据源是 `plan-tree-sessions` 那份配置文档的
    # 共享镜像（`ctx.configForms.describe()`）。
    # 需要挂在有浏览器表面的 profile 上；纯宿主 profile 停用这一行即可。
    - id: task-tree-ui
      name: '@t4r71/dsh-ui-task-tree'

    # 2026-09-29：`task-tree-host` 行**连同整包一并删除**（用户裁决），故这里不再留开关。
    # 理由：它提供的 `taskTree` 会话投影**零消费者**，而写入的 `taskTree/declared` 事件
    # 不在 0.1.7 的 KNOWN_SESSION_EVENT_TYPES 白名单里
    # （dsh-session/lib/types/known-event-types.js:21-81），持久化读路径对白名单外且
    # 非 `ignorable` 的事件会**拒绝解释整个 log**（dsh-session-persistence/lib/index.js:184）。
    # 该形态最险之处在于**写入侧毫无警告**：会话当时一切正常，直到某天重开时整份日志作废。
    # 已由协调者一手复现，见 M:\T4\out\stage2\evidence\verify-log-safety\README.md。
