# The prompt-plan bundle patch: one host row inserting the section-name-matched
# system-prompt rewriter.
#
# The row id `prompt-plan` is load-bearing twice over, exactly as `dual-axis` is
# in this repo:
#   - it is the Loader entry id, and thus the settings namespace the settings
#     service looks the entry up by (0.1.7: ns == entry id);
#   - it is the id a profile-level `cordis.patch.yml` targets to override this
#     row's config without touching the package.
#
# One row only. This bundle carries no client half, so no `dsh.client` and no
# `-ui` sibling package.
#
# config.rulesFile is seeded EMPTY on purpose. The rules file lives in the
# PROFILE directory, next to cordis.patch.yml, not inside this package
# (operator decision: rules and package stay separate, so a package upgrade
# never carries an operator's prompt rules with it). Point it at an absolute
# path, or leave it empty and set it from the profile patch layer.
- insert:
    - id: prompt-plan
      name: '@t4r71/dsh-prompt-plan'
      config:
        # '' -> the plugin runs in observe mode against the default artifact
        # directory (see README, "Where the artifacts go").
        rulesFile: ''
        # 'observe' never modifies a section; 'rewrite' applies the rules file.
        # The operator's own decision is: run a full observation window FIRST,
        # write the baseline from it, and only then switch to 'rewrite'.
        mode: observe
        artifactDir: ''
        # The cache-stability diagnostics (cache-prefix.jsonl + cache-usage.jsonl).
        # OFF on purpose: it is a second listener and a second pair of files, and
        # an operator who is not chasing a cache problem should pay neither. Turn
        # it on while investigating a hit-rate drop; see the README section
        # "Cache-stability diagnostics" for what it can and cannot conclude.
        cacheDiag: false
